name: Build market calendar

on:
  schedule:
    - cron: '10 21 * * *'   # 06:10 KST
    - cron: '10 9 * * *'    # 18:10 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build market.ics
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 build_ics.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market.ics
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: refresh market.ics ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
